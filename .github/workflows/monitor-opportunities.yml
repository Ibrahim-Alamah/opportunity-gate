name: Weekly Opportunity Monitoring

on:
  schedule:
    # Runs every Monday at 06:00 UTC (09:00 Yemen time, UTC+3)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: monitor-opportunities
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate opportunities dataset
        run: npm run validate:data

      - name: Run online opportunity monitoring
        run: npm run monitor:data -- --online

